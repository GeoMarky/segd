name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install the pinned version of uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.13
          version-file: "${{ github.workspace }}/pyproject.toml"

      - name: Install bumpversion
        run: |
          uv tool install --constraint=.github/workflows/constraints.txt bump-my-version
          bump-my-version --version

      - name: Check if there is a parent commit
        id: check-parent-commit
        run: |
          echo "sha=$(git rev-parse --verify --quiet HEAD^)" >> $GITHUB_OUTPUT

      - name: Detect and tag new version
        id: check-version
        if: steps.check-parent-commit.outputs.sha
        run: |
          set -euo pipefail
          current="$(bump-my-version show current_version)"
          git checkout --quiet HEAD^
          previous="$(bump-my-version show current_version)"
          git checkout --quiet -
          {
            echo "previous-version=${previous}"
            echo "current-version=${current}"
          } >> "$GITHUB_OUTPUT"
          echo "Previous version: ${previous}"
          echo "Current version: ${current}"
          if [[ "${current}" == "${previous}" ]]; then
            exit 0
          fi
          tag="v${current}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "${tag}" -m "Released version ${current}"
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Bump version for developmental release
        if: "! steps.check-version.outputs.tag"
        run: |
          bump-my-version bump patch &&
          version=$(bump-my-version show current_version) &&
          bump-my-version bump --new-version $version.dev$(date +%s)

      - name: Build package
        run: |
          uv build

      - name: Publish package on PyPI
        if: steps.check-version.outputs.tag
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [[ -z "${UV_PUBLISH_TOKEN}" ]]; then
            echo "::warning title=PyPI publish skipped::PYPI_TOKEN is not set, so this release was not uploaded."
            exit 0
          fi
          uv publish --trusted-publishing never --no-attestations

      - name: Publish package on TestPyPI
        if: "! steps.check-version.outputs.tag"
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          if [[ -z "${UV_PUBLISH_TOKEN}" ]]; then
            echo "::warning title=TestPyPI publish skipped::TEST_PYPI_TOKEN is not set, so this developmental release was not uploaded."
            exit 0
          fi
          uv publish \
            --trusted-publishing never \
            --no-attestations \
            --publish-url https://test.pypi.org/legacy/

      - name: Publish the release notes
        uses: release-drafter/release-drafter@v7.10.0
        with:
          publish: ${{ steps.check-version.outputs.tag != '' }}
          tag: ${{ steps.check-version.outputs.tag }}
          config-name: release-drafter.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
